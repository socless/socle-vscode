name: Release

# A pushed `v*` tag checks the version and the release notes, builds the vsix
# and publishes it as a GitHub release. A manual dispatch only checks and
# builds. The build downloads the pinned Socle release's server jar: while
# socless/socle is private, that needs a SOCLE_TOKEN secret (read access to
# socless/socle); without it the job stops and the release is made locally
# (DEVELOPING.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Check, build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version and release notes
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          ver=$(grep -oP 'publishVer\s*=\s*"\K[^"]+' build.mill)
          if [ "$REF_TYPE" = tag ] && [ "${TAG#v}" != "$ver" ]; then
            echo "::error::tag $TAG does not match V.publishVer = $ver in build.mill"; exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then tools/release/notes.sh "$ver" > notes.md; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Access to the Socle release
        env:
          SOCLE_TOKEN: ${{ secrets.SOCLE_TOKEN }}
        run: |
          if [ -z "$SOCLE_TOKEN" ]; then
            echo "::error::no SOCLE_TOKEN secret: the pinned server jar cannot be downloaded while socless/socle is private (release locally, see DEVELOPING.md)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the vsix
        env:
          GH_TOKEN: ${{ secrets.SOCLE_TOKEN }}
        run: ./mill vsix

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" out/vsix.dest/*.vsix --title "Socle for VS Code ${TAG#v}" --notes-file notes.md
