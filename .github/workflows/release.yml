name: Release

# A pushed `v*` tag checks the version and the release notes, builds the vsix
# (bundling the pinned Socle server), publishes it as a GitHub release, then on
# the Visual Studio Marketplace by trusted publishing (OIDC: no token; the
# socless publisher trusts socless/socle-vscode's release.yml) and on Open VSX,
# also by trusted publishing (the socless namespace trusts the same workflow),
# once the repository variable OPENVSX_PUBLISH is "true". A manual dispatch
# only checks and builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # the GitHub release
  id-token: write  # trusted publishing (OIDC) on the Marketplace and Open VSX

jobs:
  release:
    name: Check, build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version and release notes
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          ver=$(grep -oP 'publishVer\s*=\s*"\K[^"]+' build.mill)
          if [ "$REF_TYPE" = tag ] && [ "${TAG#v}" != "$ver" ]; then
            echo "::error::tag $TAG does not match V.publishVer = $ver in build.mill"; exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then tools/release/notes.sh "$ver" > notes.md; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"  # vsce 4 (trusted publishing) needs Node 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./mill vsix

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" out/vsix.dest/*.vsix --title "Socle for VS Code ${TAG#v}" --notes-file notes.md

      # Trusted publishing (vsce 4.0+): vsce exchanges the job's OIDC token for a
      # 15-minute Marketplace credential; it never falls back to a token.
      - name: Publish on the Visual Studio Marketplace
        if: github.ref_type == 'tag'
        run: npx --yes @vscode/vsce@4.0.0 publish --oidc --packagePath out/vsix.dest/*.vsix

      # Trusted publishing (ovsx 1.2+): the OIDC token is exchanged for a
      # short-lived Open VSX publishing token.
      - name: Publish on Open VSX
        if: github.ref_type == 'tag' && vars.OPENVSX_PUBLISH == 'true'
        run: npx --yes ovsx@1.3.0 publish --trusted-publishing out/vsix.dest/*.vsix
