name: Release

# A pushed `v*` tag checks the version and the release notes, builds the vsix
# (bundling the pinned Socle server), publishes it as a GitHub release, then on
# the Visual Studio Marketplace (VSCE_PAT secret) and on Open VSX (OVSX_PAT
# secret); a registry whose secret is missing is skipped with a warning. A
# manual dispatch only checks and builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Check, build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version and release notes
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          ver=$(grep -oP 'publishVer\s*=\s*"\K[^"]+' build.mill)
          if [ "$REF_TYPE" = tag ] && [ "${TAG#v}" != "$ver" ]; then
            echo "::error::tag $TAG does not match V.publishVer = $ver in build.mill"; exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then tools/release/notes.sh "$ver" > notes.md; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./mill vsix

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" out/vsix.dest/*.vsix --title "Socle for VS Code ${TAG#v}" --notes-file notes.md

      - name: Publish on the Visual Studio Marketplace
        if: github.ref_type == 'tag'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::warning::no VSCE_PAT secret: not published on the Visual Studio Marketplace"; exit 0; fi
          vsce=$(grep -oP 'val vsce\s*=\s*"\K[^"]+' build.mill)
          npx --yes "@vscode/vsce@$vsce" publish --packagePath out/vsix.dest/*.vsix

      - name: Publish on Open VSX
        if: github.ref_type == 'tag'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::warning::no OVSX_PAT secret: not published on Open VSX"; exit 0; fi
          npx --yes ovsx@0.10.1 publish out/vsix.dest/*.vsix
